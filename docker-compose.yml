services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pharmos
      POSTGRES_USER: pharmos
      POSTGRES_PASSWORD: pharmos
    ports:
      - "5432:5432"
    volumes:
      - pharmos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmos -d pharmos"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pharmos.dev
      PGADMIN_DEFAULT_PASSWORD: pharmos
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pharmos-pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pharmos-postgres-data:
  pharmos-pgadmin-data:
